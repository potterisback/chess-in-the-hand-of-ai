<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess in the Hand of AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Chess in the Hand of AI</h1>
    <p class="sub">Mid-project version · two players on the same screen</p>
  </header>

  <main>
    <section class="board-area">
      <div class="board-wrap">
        <div id="board" class="board" aria-label="Chess board"></div>
        <div id="promo" class="promo hidden"></div>
      </div>
    </section>

    <aside class="panel">
      <div class="card">
        <div class="status" id="status">White to move</div>

        <h2>Settings</h2>
        <label class="check"><input type="checkbox" id="showHints" checked> Show legal moves</label>
        <label class="check"><input type="checkbox" id="showCoords" checked> Show coordinates</label>
        <label class="check"><input type="checkbox" id="autoFlip"> Turn the board after each move</label>

        <div class="buttons">
          <button id="newGame" class="primary">New game</button>
          <button id="undo">Undo</button>
          <button id="flip">Flip</button>
        </div>
      </div>

      <div class="card">
        <h2>Moves</h2>
        <ol class="moves" id="moves"></ol>
      </div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
